<div class="login-container rounded">

    <h2>Iniciar sesión</h2>

    @if(serverErrorMessage()) {
        <div class="alert alert-danger">{{ serverErrorMessage() }}</div>
    }
    @if(successMessage()) {
        <div class="alert alert-success">{{ successMessage() }}</div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="login()">

        <div class="controls-container">

            <div class="control-container">
                <label class="form-label" for="email">Correo</label>
                <input class="form-control" type="email" id="email" formControlName="email">
            </div>

            <div class="control-container">
                <label class="form-label" for="password">Contraseña</label>
                <input class="form-control" type="password" id="password" formControlName="password">
            </div>

        </div>

        <button class="btn btn-primary" type="submit" [disabled]="isFormDisabled()">Iniciar sesión</button>

    </form>

    <button class="btn btn-outline-secondary" type="submit">¿Olvidaste tu contraseña?</button>
    <button class="btn btn-outline-primary" type="submit" routerLink="/auth/register">Crear una cuenta</button>

</div>
